# This workflow will prebuild native binaries for supported NodeJS versions, and add them to the Github release that triggered the workflow

name: Add native binaries to release

on:
  release:
    types: [created]

jobs:
  augment-release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]
        # ubuntu-latest is x64; ubuntu-24.04-arm provides the arm64 (glibc) build for Linux
        # macos-latest is arm64; macos-15-intel provides the x64 build for Intel Macs
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Add msbuild to PATH
        if: matrix.os == 'windows-2022'
        uses: microsoft/setup-msbuild@v3
      - name: build using node-pre-gyp
        run: |
          npm install --build-from-source
          npx node-pre-gyp package
      - name: Upload native binaries for Node ${{ matrix.node-version }} for ${{ matrix.os }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" build/stage/*.tar.gz --clobber --repo "$REPOSITORY"

  alpine-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
        alpine-version: ['3.20']
        include:
          # node:26 images are not published for alpine3.20
          - node-version: 26
            alpine-version: '3.22'
    container: node:${{ matrix.node-version }}-alpine${{ matrix.alpine-version }}
    steps:
      - uses: actions/checkout@v7
      - name: install build deps
        run: |
          apk add g++ make python3 github-cli
      - name: build using node-pre-gyp
        run: |
          npm install
          npx node-pre-gyp rebuild
          npx node-pre-gyp package
      - name: Upload native binaries for Node ${{ matrix.node-version }} for alpine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" build/stage/*.tar.gz --clobber --repo "$REPOSITORY"
